name: Release

# Run from the Actions tab once a release PR is merged: it bumps the version and
# dates the changelog with `python scripts/release.py bump patch|minor`.
# `prepare` checks that main's version is new on the index and has a dated
# changelog section, then tests and builds. `publish` waits for a required
# reviewer of the `pypi` environment, uploads, and creates the GitHub Release,
# which tags the tested commit. Nothing is pushed to git. Runs outside
# boson-ai, such as on a fork, upload to TestPyPI instead.

on:
  workflow_dispatch:

concurrency: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Check main is ready to release
        id: check
        run: |
          version="$(uv version --short)"
          index=https://pypi.org
          [ "$GITHUB_REPOSITORY" = boson-ai/pipecat-boson ] || index=https://test.pypi.org
          status="$(curl -sS -o /dev/null -w '%{http_code}' "$index/pypi/pipecat-boson/$version/json")"
          if [ "$status" != 404 ]; then
            echo "Expected $version to be new on $index, got HTTP $status. Merge a release PR first;"
            echo "if an earlier run uploaded $version but failed after, re-run that run's failed job instead."
            exit 1
          fi
          # An assignment, so a failed lookup stops the step instead of reading as "no tag".
          tag="$(git ls-remote --tags origin "refs/tags/v$version")"
          if [ -n "$tag" ]; then
            echo "Tag v$version already exists. Merge a release PR first."
            exit 1
          fi
          uv run --no-project python scripts/release.py notes "$version" > notes.md
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          { echo "## Releasing $version"; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - run: uv sync --extra test
      - run: uv run --no-sync python -m pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: release
          if-no-files-found: error
          path: |
            dist/
            notes.md

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    # The PyPI token is a secret of this environment: a job gets it only from main, after a required reviewer approves.
    environment: pypi
    permissions:
      contents: write # create the GitHub Release and its tag
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Upload
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
          PUBLISH_URL: >-
            ${{ github.repository == 'boson-ai/pipecat-boson'
            && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
        # A re-run after the next step failed uploads the same files again, which PyPI accepts.
        run: uv publish --trusted-publishing never --publish-url "$PUBLISH_URL"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        # Creates the tag on the commit `prepare` tested.
        run: >-
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY"
          --target "$SHA" --title "$VERSION" --notes-file notes.md
