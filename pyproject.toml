[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecat-boson"
version = "0.1.3"
description = "Pipecat realtime LLM service for the Boson Realtime API"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3,<1",
    "pipecat-ai>=1.4.0,<2",
    "websockets>=13.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
webrtc = [
    "pipecat-ai[runner,webrtc]>=1.4.0,<2",
    "python-dotenv>=1.0.0,<2",
]
test = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]
dev = [
    "pipecat-ai[runner,webrtc]>=1.4.0,<2",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "python-dotenv>=1.0.0,<2",
    "ruff==0.3.4",
]

[tool.uv]
# nltk 3.10.1 (pulled in via pipecat-ai) ships an import-security hook that
# blocks imports resolving under the CWD, which misfires on in-project .venvs
# and breaks the test suite at collection time.
constraint-dependencies = ["nltk!=3.10.1"]

[tool.setuptools.packages.find]
include = ["pipecat_boson*"]

[tool.ruff]
line-length = 119
target-version = "py311"
indent-width = 4

[tool.ruff.lint]
preview = true
ignore-init-module-imports = true
extend-select = [
    "B009",
    "B010",
    "CPY",
    "E",
    "F",
    "I",
    "TID251",
    "UP",
    "W",
]
ignore = [
    "E501",
    "E741",
    "W605",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
line-ending = "auto"
